name: daily signals

on:
  schedule:
    - cron: "0 6 * * *"   # every day, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Find signals
        env:
          # GitHub code search needs a token. The built-in one is used unless a
          # SEARCH_TOKEN secret (read-only personal token) is set.
          GITHUB_TOKEN: ${{ secrets.SEARCH_TOKEN || secrets.GITHUB_TOKEN }}
        run: python3 sandbox_signals.py --arbeitnow-pages 3 --max-orgs 40 --probe 15

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output
          if [ -d state ]; then git add state; fi
          if git diff --cached --quiet; then
            echo "nothing new today"
          else
            git commit -m "signals $(date -u +%F)"
            git push
          fi
